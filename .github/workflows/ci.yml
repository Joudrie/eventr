# Gates every push and pull request.
#
# `npm run verify` is also a pre-commit hook, but a hook only protects `main` until
# someone passes --no-verify. This is the check that actually holds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, contrast, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck + lint + prettier + WCAG contrast audit + feed and format tests
      - run: npm run verify

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only — the suite exercises app behavior, not browser differences.
      - run: npx playwright install --with-deps chromium
      # Playwright starts the Expo dev server itself; see playwright.config.ts.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Catches anything that only breaks in a production bundle — the static export
      # is a different code path from the dev server, and has hidden real bugs before.
      - run: npx expo export --platform web
      - name: Check the export produced real pages
        run: |
          test -f dist/index.html
          test -f dist/event/e-wakefield-market.html
          # .nojekyll matters: without it Pages deletes the whole _expo bundle directory.
          grep -q "Eventr" dist/index.html
          grep -q "Wakefield Farmers Market" dist/event/e-wakefield-market.html
